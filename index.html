<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>رسالة لك 💌</title>
<style>
  body{
    margin:0; height:100vh; display:flex; align-items:center;
    justify-content:center; background:linear-gradient(135deg,#667eea,#764ba2);
    font-family:Tahoma, sans-serif; color:#fff;
  }
  .card{
    background:rgba(255,255,255,0.15); backdrop-filter:blur(10px);
    padding:40px; border-radius:20px; text-align:center;
    max-width:400px; box-shadow:0 8px 32px rgba(0,0,0,0.3);
  }
  h1{font-size:28px; margin-bottom:15px;}
  p{font-size:18px; line-height:1.8;}
</style>
</head>
<body>
  <div class="card">
    <h1>أهلاً 👋</h1>
    <p id="msg">جاري تحميل الرسالة...</p>
  </div>

<script>
  // نجيب الاسم من الرابط: ?name=أحمد
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name') || 'صديقي';
  document.getElementById('msg').innerHTML =
    `عزيزي <b>${name}</b>،<br>دي رسالة خاصة ليك 💙<br>أتمنى تكون بخير دايماً!`;
</script>
</body>
</html>
